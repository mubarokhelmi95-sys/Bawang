class Rig{
  constructor(gltf,name){
    this.name=name;this.holder=new THREE.Group();this.holder.name=name;this.root=gltf.scene;this.holder.add(this.root);
    this.b={};this.nameOf=new Map();
    this.root.traverse(o=>{if(o.isBone){const k=o.name.replace(/^mixamorig:?/,'');this.b[k]=o;this.nameOf.set(o,k)}});
    if(!this.b.Hips)throw new Error('Rig '+name+': tulang Hips tidak ditemukan. Nama tulang: '+Object.keys(this.b).slice(0,8).join(','));
    this.root.updateMatrixWorld(true);
    this.restQ={};this.restW={};this.restP={};
    for(const k in this.b){const o=this.b[k];this.restQ[k]=o.quaternion.clone();this.restW[k]=o.getWorldQuaternion(new THREE.Quaternion());this.restP[k]=o.getWorldPosition(new THREE.Vector3())}
    this.restHips=this.b.Hips.position.clone();
    this.len={};this.dir={};
    for(const s of['Left','Right']){
      const U=this.restP[s+'Arm'],F=this.restP[s+'ForeArm'],H=this.restP[s+'Hand'];
      this.len[s+'Arm']=U.distanceTo(F);this.len[s+'ForeArm']=F.distanceTo(H);
      this.dir[s+'Arm']=F.clone().sub(U).normalize();this.dir[s+'ForeArm']=H.clone().sub(F).normalize();
    }
    this.morphMeshes=[];
    this.root.traverse(o=>{
      if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;if(o.morphTargetDictionary)this.morphMeshes.push(o);styleMaterial(o)}
    });
  }
  reset(){for(const k in this.b)this.b[k].quaternion.copy(this.restQ[k]);this.b.Hips.position.copy(this.restHips)}
  setDelta(k,Q){const b=this.b[k];if(!b)return;const Rr=this.restW[k];
    b.quaternion.copy(this.restQ[k]).multiply(Rr.clone().invert().multiply(Q).multiply(Rr))}
  holderInvQ(){return this.holder.getWorldQuaternion(new THREE.Quaternion()).invert()}
  deltaTotal(bone){ // delta kumulatif (ruang holder) dari rest
    const name=this.nameOf.get(bone);const q=bone.getWorldQuaternion(new THREE.Quaternion());
    return this.holderInvQ().multiply(q).multiply(this.restW[name].clone().invert());
  }
  solveArm(side,tw){
    const up=this.b[side+'Arm'],fo=this.b[side+'ForeArm'];
    const inv=this.holder.matrixWorld.clone().invert();
    const S0=up.getWorldPosition(new THREE.Vector3()).applyMatrix4(inv);
    const T=tw.clone().applyMatrix4(inv);
    const sg=side==='Left'?1:-1;const pole=V(sg*0.5,-1,-0.45);
    const {d1,d2}=ik2(S0,T,this.len[side+'Arm'],this.len[side+'ForeArm'],pole);
    const Dp=this.deltaTotal(up.parent);
    const q1=new THREE.Quaternion().setFromUnitVectors(this.dir[side+'Arm'],d1.clone().applyQuaternion(Dp.clone().invert()));
    this.setDelta(side+'Arm',q1);up.updateMatrixWorld(true);
    const Du=this.deltaTotal(up);
    const q2=new THREE.Quaternion().setFromUnitVectors(this.dir[side+'ForeArm'],d2.clone().applyQuaternion(Du.invert()));
    this.setDelta(side+'ForeArm',q2);fo.updateMatrixWorld(true);
  }
  pose(deltas,ik,morph){
    this.reset();
    for(const k in deltas)this.setDelta(k,deltas[k]);
    this.holder.updateMatrixWorld(true);
    if(ik)for(const s of['Left','Right'])if(ik[s])this.solveArm(s,V(...ik[s]));
    for(const m of this.morphMeshes){const d=m.morphTargetDictionary,inf=m.morphTargetInfluences;
      for(const k in d)inf[d[k]]=(morph&&morph[k])||0}
    this.holder.updateMatrixWorld(true);
  }
  pos(k){return this.b[k].getWorldPosition(new THREE.Vector3())}
}
function ik2(S0,T,L1,L2,pole){
  const v=T.clone().sub(S0),dist=v.length(),a=v.clone().divideScalar(dist+1e-9);
  const d=Math.min(Math.max(dist,Math.abs(L1-L2)+1e-4),L1+L2-1e-4);
  const ca=Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d)));const sa=Math.sqrt(1-ca*ca);
  const n=pole.clone().sub(a.clone().multiplyScalar(pole.dot(a)));n.normalize();
  const E=S0.clone().add(a.clone().multiplyScalar(ca*L1)).add(n.multiplyScalar(sa*L1));
  const Te=S0.clone().add(a.clone().multiplyScalar(d));
  return{d1:E.clone().sub(S0).divideScalar(L1),d2:Te.clone().sub(E).divideScalar(L2)};
}

/* ============ UI & PEMUTAR ============ */
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const RH=Math.min(1920,parseInt(params.get('q')||'1280',10)),RW=Math.round(RH*9/16);
function showErr(msg){const e=$('err');e.style.display='block';e.textContent+=msg+'\n';console.error(msg)}
addEventListener('error',e=>showErr('Error: '+(e.message||e)));
addEventListener('unhandledrejection',e=>showErr('Error: '+(e.reason&&e.reason.message||e.reason)));
const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
async function main(){
  const view=$('view'),ctx=view.getContext('2d');view.width=RW;view.height=RH;
  const aud=$('aud');for(const src of AUDIO_SRC){const s=document.createElement('source');s.src=src;aud.appendChild(s)}
  aud.load();
  $('status').textContent='Memuat karakter…';
  const loader=new GLTFLoader(),gl={};
  for(const k of['W','M','B']){try{gl[k]=await loader.loadAsync(ASSETS[k])}catch(e){throw new Error('Gagal memuat '+ASSETS[k]+'. Pastikan file .glb ada satu folder dengan index.html dan halaman dibuka lewat http(s) (GitHub Pages / server lokal), bukan file://')}}
  $('status').textContent='Menyiapkan adegan…';
  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:true});
  renderer.setPixelRatio(1);renderer.setSize(RW,RH,false);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=parseFloat(params.get('exposure')||'0.9');
  const world=new World(gl,renderer);
  const composer=new EffectComposer(renderer);composer.setSize(RW,RH);
  composer.addPass(new RenderPass(world.scene,world.camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(RW,RH),0.32,0.55,1.0));
  const fin=new ShaderPass({uniforms:{tDiffuse:{value:null},fade:{value:0},flash:{value:0}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform sampler2D tDiffuse;uniform float fade;uniform float flash;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(0.299,0.587,0.114));c.rgb=mix(vec3(l),c.rgb,1.08);float d=distance(vUv,vec2(0.5));c.rgb*=1.0-0.40*smoothstep(0.30,0.85,d);c.rgb=mix(c.rgb,vec3(3.0),flash);c.rgb*=(1.0-fade);gl_FragColor=c;}'});
  composer.addPass(fin);composer.addPass(new OutputPass());
  function drawText(txt,x,y,size,col){ctx.font=`900 ${size}px "Segoe UI",Arial,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=size*0.14;ctx.strokeStyle='#111';ctx.strokeText(txt,x,y);ctx.fillStyle=col;ctx.fillText(txt,x,y)}
  function subtitle(s){
    const size=Math.round(RH*0.036);ctx.font=`800 ${size}px "Segoe UI",Arial,sans-serif`;const maxW=RW-RW*0.1;
    const words=s.split(' '),lines=[];let cur='';for(const w of words){const t=(cur+' '+w).trim();if(ctx.measureText(t).width<maxW)cur=t;else{lines.push(cur);cur=w}}lines.push(cur);
    const lh=size*1.25,bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+size*0.9,bh=lines.length*lh+size*0.35,y0=RH*0.80;
    ctx.fillStyle='rgba(0,0,0,0.45)';const x0=(RW-bw)/2,r=size*0.4;ctx.beginPath();ctx.moveTo(x0+r,y0);ctx.arcTo(x0+bw,y0,x0+bw,y0+bh,r);ctx.arcTo(x0+bw,y0+bh,x0,y0+bh,r);ctx.arcTo(x0,y0+bh,x0,y0,r);ctx.arcTo(x0,y0,x0+bw,y0,r);ctx.fill();
    lines.forEach((l,i)=>drawText(l,RW/2,y0+size*0.18+lh*(i+0.5),size,'#fff'));
  }
  function frame(t){
    world.update(t);fin.uniforms.fade.value=world.fx.fade;fin.uniforms.flash.value=world.fx.flash;
    composer.render();ctx.drawImage(renderer.domElement,0,0,RW,RH);
    for(const f of world.fx.texts){const p=world.project(f.p,RW,RH);drawText(f.txt,p.x,p.y,f.size*RH,f.col)}
    const s=subAt(t);if(s)subtitle(s);
  }
  // ---- pemutar ----
  let playing=false,tClock=0,last=0,hasAudio=true;
  aud.addEventListener('error',()=>{hasAudio=false});
  const slider=$('seek');slider.max=DUR;
  const curT=()=>(hasAudio&&aud.readyState>=2)?aud.currentTime:tClock;
  function setT(t){t=Math.min(DUR,Math.max(0,t));tClock=t;if(hasAudio&&aud.readyState>=1)aud.currentTime=t;frame(t);slider.value=t;$('time').textContent=fmt(t)+' / '+fmt(DUR)}
  async function play(){
    if(curT()>=DUR-0.05)setT(0);playing=true;last=performance.now();$('overlay').style.display='none';$('pp').textContent='⏸';

  }
  function pause(){playing=false;aud.pause();$('pp').textContent='▶'}

    requestAnimationFrame(loop);
    if(!playing)return;

    last=now;
    if(t>=DUR){frame(DUR-0.001);pause();$('pp').textContent='↺';if(recording)stopRec();return}
    tClock=t;frame(t);slider.value=t;$('time').textContent=fmt(t)+' / '+fmt(DUR);
  }
  $('start').onclick=play;$('pp').onclick=()=>playing?pause():play();
  slider.oninput=()=>setT(parseFloat(slider.value));

  $('full').onclick=()=>{const s=$('stage');(document.fullscreenElement?document.exitFullscreen():s.requestFullscreen&&s.requestFullscreen())};
  // ---- rekam ----
  let rec=null,recording=false,chunks=[];
  function stopRec(){if(rec&&rec.state!=='inactive')rec.stop();recording=false}
  $('rec').onclick=async()=>{
    if(recording){stopRec();return}
    if(!window.MediaRecorder){showErr('Browser tidak mendukung MediaRecorder. Gunakan Chrome/Edge.');return}
    const stream=view.captureStream(30);
    try{const as=aud.captureStream?aud.captureStream():aud.mozCaptureStream();as.getAudioTracks().forEach(tr=>stream.addTrack(tr))}catch(e){showErr('Audio tidak ikut terekam: '+e.message)}
    const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14e6});chunks=[];
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='video-bawang.webm';a.click();$('rec').textContent='⏺ Rekam';recording=false};
    recording=true;$('rec').textContent='⏹ Berhenti';setT(0);rec.start(250);await play();
  };
  setT(0);$('status').textContent='';$('start').disabled=false;$('start').textContent='▶ Putar';requestAnimationFrame(loop);
}
main().catch(e=>{showErr(e.message||String(e));$('status').textContent='Gagal memuat — lihat pesan error di bawah.'});
